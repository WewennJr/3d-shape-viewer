<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualiseur 3D - Vynkor</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="ui">
    <h1>🔭 Visualiseur 3D</h1>
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="shapes">📐 Formes</button>
      <button class="tab-btn" data-tab="material">🎨 Matériau</button>
      <button class="tab-btn" data-tab="lighting">💡 Éclairage</button>
      <button class="tab-btn" data-tab="post">✨ Post-proc</button>
      <button class="tab-btn" data-tab="export">💾 Export</button>
    </div>

    <div id="controls">
      <!-- Shapes Tab -->
      <div class="tab-panel active" id="tab-shapes">
        <div class="control-group">
          <label>Forme</label>
          <div class="shape-grid" id="shape-buttons"></div>
        </div>
        <div class="control-group">
          <label>Environnement</label>
          <select id="env-select">
            <option value="studio">Studio</option>
            <option value="sunset">Coucher de soleil</option>
            <option value="night">Nuit</option>
            <option value="warehouse">Entrepôt</option>
            <option value="forest">Forêt</option>
            <option value="apartment">Appartement</option>
            <option value="none">Aucun</option>
          </select>
        </div>
        <div class="control-group">
          <div class="btn-row">
            <button id="reset-cam">🔄 Réinitialiser caméra</button>
            <button id="toggle-anim">⏯️ Pause/Reprendre</button>
          </div>
        </div>
        <div class="control-group">
          <div class="slider-row">
            <label>Vitesse rot.</label>
            <input type="range" id="speed-range" min="0" max="5" step="0.1" value="1">
            <span id="speed-val" style="min-width: 35px;">1.0x</span>
          </div>
        </div>
      </div>

      <!-- Material Tab -->
      <div class="tab-panel" id="tab-material">
        <div class="control-group">
          <label>Type de matériau</label>
          <select id="material-select">
            <option value="standard">Standard PBR</option>
            <option value="physical">Physical (transmission)</option>
            <option value="phong">Phong</option>
            <option value="toon">Toon / Cel-shaded</option>
            <option value="basic">Basic (unlit)</option>
            <option value="wireframe">Fil de fer</option>
            <option value="normal">Normales</option>
            <option value="matcap">MatCap</option>
          </select>
        </div>
        <div class="control-group" id="pbr-controls">
          <div class="color-row">
            <label>Couleur</label>
            <input type="color" id="color-base" value="#4361ee">
            <input type="text" id="color-base-hex" value="#4361ee" readonly>
          </div>
          <div class="slider-row">
            <label>Roughness: <span id="rough-val">0.3</span></label>
            <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.3">
          </div>
          <div class="slider-row">
            <label>Metalness: <span id="metal-val">0.6</span></label>
            <input type="range" id="metalness" min="0" max="1" step="0.01" value="0.6">
          </div>
          <div class="slider-row">
            <label>Clearcoat: <span id="clear-val">0.2</span></label>
            <input type="range" id="clearcoat" min="0" max="1" step="0.01" value="0.2">
          </div>
          <div class="slider-row">
            <label>Clearcoat R.: <span id="clearR-val">0.1</span></label>
            <input type="range" id="clearcoatRoughness" min="0" max="1" step="0.01" value="0.1">
          </div>
          <div class="slider-row">
            <label>Transmission: <span id="trans-val">0</span></label>
            <input type="range" id="transmission" min="0" max="1" step="0.01" value="0">
          </div>
          <div class="slider-row">
            <label>Thickness: <span id="thick-val">0</span></label>
            <input type="range" id="thickness" min="0" max="2" step="0.01" value="0">
          </div>
          <div class="slider-row">
            <label>IOR: <span id="ior-val">1.5</span></label>
            <input type="range" id="ior" min="1" max="3" step="0.01" value="1.5">
          </div>
          <div class="slider-row">
            <label>Emissive Int.: <span id="emi-val">0</span></label>
            <input type="range" id="emissiveIntensity" min="0" max="5" step="0.01" value="0">
          </div>
          <div class="color-row">
            <label>Emissive</label>
            <input type="color" id="emissiveColor" value="#000000">
            <input type="text" id="emissiveColor-hex" value="#000000" readonly>
          </div>
        </div>
      </div>

      <!-- Lighting Tab -->
      <div class="tab-panel" id="tab-lighting">
        <div class="control-group">
          <label>Ambient Intensity</label>
          <div class="slider-row">
            <span id="amb-val">0.5</span>
            <input type="range" id="ambient-intensity" min="0" max="3" step="0.01" value="0.5">
          </div>
        </div>
        <div class="control-group">
          <label>Directional Light</label>
          <div class="slider-row">
            <label>Intensité</label>
            <input type="range" id="dir-intensity" min="0" max="5" step="0.01" value="1.5">
          </div>
          <div class="slider-row">
            <label>Pos X</label>
            <input type="range" id="dir-x" min="-20" max="20" step="0.1" value="5">
          </div>
          <div class="slider-row">
            <label>Pos Y</label>
            <input type="range" id="dir-y" min="0" max="30" step="0.1" value="10">
          </div>
          <div class="slider-row">
            <label>Pos Z</label>
            <input type="range" id="dir-z" min="-20" max="20" step="0.1" value="7">
          </div>
          <div class="color-row">
            <label>Couleur</label>
            <input type="color" id="dir-color" value="#ffffff">
          </div>
        </div>
        <div class="control-group">
          <label>Fill Light</label>
          <div class="slider-row">
            <label>Intensité</label>
            <input type="range" id="fill-intensity" min="0" max="3" step="0.01" value="0.5">
          </div>
          <div class="color-row">
            <label>Couleur</label>
            <input type="color" id="fill-color" value="#4361ee">
          </div>
        </div>
        <div class="control-group">
          <label>Rim Light</label>
          <div class="slider-row">
            <label>Intensité</label>
            <input type="range" id="rim-intensity" min="0" max="2" step="0.01" value="0.4">
          </div>
          <div class="color-row">
            <label>Couleur</label>
            <input type="color" id="rim-color" value="#ff6b6b">
          </div>
        </div>
        <div class="control-group">
          <div class="checkbox-row">
            <input type="checkbox" id="shadows-enabled" checked>
            <label>Ombres activées</label>
          </div>
        </div>
      </div>

      <!-- Post-processing Tab -->
      <div class="tab-panel" id="tab-post">
        <div class="control-group">
          <label>Tone Mapping</label>
          <select id="tone-mapping">
            <option value="none">Aucun</option>
            <option value="linear">Linear</option>
            <option value="reinhard">Reinhard</option>
            <option value="cineon">Cineon</option>
            <option value="aces" selected>ACES Filmic</option>
          </select>
        </div>
        <div class="control-group">
          <div class="slider-row">
            <label>Exposure: <span id="exp-val">1.2</span></label>
            <input type="range" id="exposure" min="0.1" max="3" step="0.01" value="1.2">
          </div>
        </div>
        <div class="control-group">
          <div class="checkbox-row">
            <input type="checkbox" id="bloom-enabled">
            <label>Bloom Effect</label>
          </div>
          <div class="slider-row" id="bloom-strength-row" style="display:none;">
            <label>Force: <span id="bloom-str-val">0.5</span></label>
            <input type="range" id="bloom-strength" min="0" max="3" step="0.01" value="0.5">
          </div>
          <div class="slider-row" id="bloom-threshold-row" style="display:none;">
            <label>Seuil: <span id="bloom-thresh-val">0.8</span></label>
            <input type="range" id="bloom-threshold" min="0" max="1" step="0.01" value="0.8">
          </div>
          <div class="slider-row" id="bloom-radius-row" style="display:none;">
            <label>Rayon: <span id="bloom-rad-val">0.4</span></label>
            <input type="range" id="bloom-radius" min="0" max="1" step="0.01" value="0.4">
          </div>
        </div>
        <div class="control-group">
          <div class="checkbox-row">
            <input type="checkbox" id="vignette-enabled">
            <label>Vignette</label>
          </div>
          <div class="slider-row" id="vignette-row" style="display:none;">
            <label>Intensité: <span id="vig-val">0.3</span></label>
            <input type="range" id="vignette" min="0" max="1" step="0.01" value="0.3">
          </div>
        </div>
        <div class="control-group">
          <div class="checkbox-row">
            <input type="checkbox" id="fxaa-enabled">
            <label>FXAA (Anti-aliasing)</label>
          </div>
        </div>
      </div>

      <!-- Export Tab -->
      <div class="tab-panel" id="tab-export">
        <div class="control-group">
          <button class="export-btn" id="export-png">📸 Capture d'écran (PNG)</button>
        </div>
        <div class="control-group">
          <button class="export-btn" id="export-gltf">📦 Exporter GLTF</button>
        </div>
        <div class="control-group">
          <button class="export-btn" id="export-json">📋 Copier config JSON</button>
        </div>
        <div class="control-group">
          <label>Résolution capture</label>
          <select id="screenshot-resolution">
            <option value="1">1x (écran)</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="stats">
    <div class="stat-line"><span>FPS</span><span class="stat-value" id="stat-fps">60</span></div>
    <div class="stat-line"><span>Triangles</span><span class="stat-value" id="stat-tris">0</span></div>
    <div class="stat-line"><span>Draw Calls</span><span class="stat-value" id="stat-draws">0</span></div>
    <div class="stat-line"><span>Mémoire</span><span class="stat-value" id="stat-mem">0 MB</span></div>
  </div>

  <div id="info">
    🖱️ Clic gauche: orbiter | 🖱️ Molette: zoom | 🖱️ Clic droit: panoramique | Espace: pause animation | R: reset caméra
  </div>
  <canvas id="canvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
